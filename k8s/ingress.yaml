# Rancher Desktop / k3s uses Traefik as the ingress controller.
# For nginx ingress + cert-manager see k8s/ingress-nginx.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prompt-db
  namespace: prompt-db
spec:
  ingressClassName: traefik
  rules:
    - host: prompt-db.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prompt-db-frontend
                port:
                  number: 80
    - host: api.prompt-db.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prompt-db-backend
                port:
                  number: 8000
