apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "prompt-db.configMapName" . }}
  namespace: {{ include "prompt-db.namespace" . }}
  labels:
    {{- include "prompt-db.labels" . | nindent 4 }}
data:
  POSTGRES_DB: {{ .Values.postgresql.auth.database | quote }}
  POSTGRES_USER: {{ .Values.postgresql.auth.username | quote }}
  ALLOW_REGISTRATION: {{ .Values.config.allowRegistration | quote }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  TRUST_PROXY_HEADERS: {{ .Values.config.trustProxyHeaders | quote }}
  VITE_API_URL: {{ .Values.config.viteApiUrl | quote }}
