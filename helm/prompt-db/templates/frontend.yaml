apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prompt-db.frontend.fullname" . }}
  namespace: {{ include "prompt-db.namespace" . }}
  labels:
    {{- include "prompt-db.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "prompt-db.frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "prompt-db.frontend.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.frontend.securityContext | nindent 8 }}
      containers:
        - name: frontend
          image: {{ include "prompt-db.frontend.image" . }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "prompt-db.configMapName" . }}
          env:
            - name: API_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "prompt-db.configMapName" . }}
                  key: VITE_API_URL
            - name: API_UPSTREAM
              value: {{ printf "http://%s.%s.svc.cluster.local:8000" (include "prompt-db.backend.fullname" .) (include "prompt-db.namespace" .) | quote }}
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "prompt-db.frontend.fullname" . }}
  namespace: {{ include "prompt-db.namespace" . }}
  labels:
    {{- include "prompt-db.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  selector:
    {{- include "prompt-db.frontend.selectorLabels" . | nindent 4 }}
  ports:
    - port: 80
      targetPort: http
      name: http
