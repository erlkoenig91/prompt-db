apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prompt-db.backend.fullname" . }}
  namespace: {{ include "prompt-db.namespace" . }}
  labels:
    {{- include "prompt-db.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "prompt-db.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "prompt-db.backend.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.backend.securityContext | nindent 8 }}
      containers:
        - name: backend
          image: {{ include "prompt-db.backend.image" . }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "prompt-db.configMapName" . }}
            - secretRef:
                name: {{ include "prompt-db.secretName" . }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "prompt-db.backend.fullname" . }}
  namespace: {{ include "prompt-db.namespace" . }}
  labels:
    {{- include "prompt-db.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  selector:
    {{- include "prompt-db.backend.selectorLabels" . | nindent 4 }}
  ports:
    - port: 8000
      targetPort: http
      name: http
