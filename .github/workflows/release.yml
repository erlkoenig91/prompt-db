name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            APP_VERSION="${GITHUB_REF_NAME#v}"
          else
            APP_VERSION="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${APP_VERSION}"

  build:
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: prompt-db-backend
            file: backend/Dockerfile
            platform: linux/amd64
            platform_slug: linux-amd64
            runner: ubuntu-latest
          - image: prompt-db-backend
            file: backend/Dockerfile
            platform: linux/arm64
            platform_slug: linux-arm64
            runner: ubuntu-24.04-arm
          - image: prompt-db-frontend
            file: frontend/Dockerfile
            platform: linux/amd64
            platform_slug: linux-amd64
            runner: ubuntu-latest
          - image: prompt-db-frontend
            file: frontend/Dockerfile
            platform: linux/arm64
            platform_slug: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          push: true
          build-args: ${{ matrix.image == 'prompt-db-frontend' && format('VITE_API_URL={0}', vars.VITE_API_URL) || '' }}
          outputs: type=image,push-by-digest=true,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }},name-canonical=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.image }}-${{ matrix.platform_slug }}.digest"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.platform_slug }}
          path: /tmp/digests/${{ matrix.image }}-${{ matrix.platform_slug }}.digest
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [resolve-version, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [prompt-db-backend, prompt-db-frontend]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          VERSION: ${{ needs.resolve-version.outputs.app_version }}
          SHA: ${{ github.sha }}
        run: |
          AMD64_DIGEST="$(tr -d '[:space:]' < /tmp/digests/${{ matrix.image }}-linux-amd64.digest)"
          ARM64_DIGEST="$(tr -d '[:space:]' < /tmp/digests/${{ matrix.image }}-linux-arm64.digest)"
          echo "amd64: ${AMD64_DIGEST}"
          echo "arm64: ${ARM64_DIGEST}"
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${SHA}" \
            "${AMD64_DIGEST}" \
            "${ARM64_DIGEST}"

  helm-release:
    needs: resolve-version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4

      - name: Sync Chart.yaml version
        env:
          APP_VERSION: ${{ needs.resolve-version.outputs.app_version }}
        run: |
          sed -i "s/^version:.*/version: ${APP_VERSION}/" helm/prompt-db/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${APP_VERSION}\"/" helm/prompt-db/Chart.yaml

      - name: Lint chart
        run: helm lint helm/prompt-db

      - name: Ensure gh-pages branch exists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            EMPTY_TREE="$(git hash-object -t tree /dev/null)"
            INIT_COMMIT="$(git commit-tree "$EMPTY_TREE" -m "Initialize gh-pages for Helm charts")"
            git push origin "$INIT_COMMIT:refs/heads/gh-pages"
          fi

      - name: Publish chart to GitHub Pages
        env:
          APP_VERSION: ${{ needs.resolve-version.outputs.app_version }}
          CHARTS_REPO_URL: https://erlkoenig91.github.io/prompt-db
        run: |
          helm package helm/prompt-db -d /tmp/charts
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages gh-pages
          cp "/tmp/charts/prompt-db-${APP_VERSION}.tgz" /tmp/gh-pages/
          cp helm/artifacthub-repo.yml /tmp/gh-pages/
          touch /tmp/gh-pages/.nojekyll
          cd /tmp/gh-pages
          if [ -f index.yaml ]; then
            helm repo index . --url "${CHARTS_REPO_URL}" --merge index.yaml
          else
            helm repo index . --url "${CHARTS_REPO_URL}"
          fi
          git add .
          git commit -m "Publish prompt-db chart ${APP_VERSION}"
          git push origin gh-pages

  release:
    needs: [resolve-version, merge, helm-release]
    if: always() && needs.resolve-version.result == 'success' && needs.merge.result == 'success' && (needs.helm-release.result == 'success' || needs.helm-release.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Container images

            | Component | Image |
            |-----------|-------|
            | Backend | `${{ env.REGISTRY }}/${{ github.repository_owner }}/prompt-db-backend:${{ needs.resolve-version.outputs.app_version }}` |
            | Frontend | `${{ env.REGISTRY }}/${{ github.repository_owner }}/prompt-db-frontend:${{ needs.resolve-version.outputs.app_version }}` |

            Multi-arch: `linux/amd64`, `linux/arm64` (native runners, no QEMU for npm).

            Additional tags: `${{ github.sha }}`, `latest`

            ## Helm chart

            ```bash
            helm repo add prompt-db https://erlkoenig91.github.io/prompt-db
            helm repo update
            helm install prompt-db prompt-db/prompt-db \
              -n prompt-db --create-namespace \
              --set secrets.postgresPassword='<password>' \
              --set secrets.secretKey='<openssl rand -hex 32>'
            ```

            Chart version: `${{ needs.resolve-version.outputs.app_version }}`

            Discoverable on [Artifact Hub](https://artifacthub.io) after repository registration.

            ## Deployment (kubectl)

            ```bash
            export REGISTRY=${{ env.REGISTRY }}/${{ github.repository_owner }}
            export TAG=${{ needs.resolve-version.outputs.app_version }}

            kubectl set image deployment/prompt-db-backend \
              backend=${REGISTRY}/prompt-db-backend:${TAG} -n prompt-db
            kubectl set image deployment/prompt-db-frontend \
              frontend=${REGISTRY}/prompt-db-frontend:${TAG} -n prompt-db
            ```
