name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            APP_VERSION="${GITHUB_REF_NAME#v}"
          else
            APP_VERSION="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${APP_VERSION}"

  build:
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: prompt-db-backend
            file: backend/Dockerfile
            platform: linux/amd64
            runner: ubuntu-latest
          - image: prompt-db-backend
            file: backend/Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: prompt-db-frontend
            file: frontend/Dockerfile
            platform: linux/amd64
            runner: ubuntu-latest
          - image: prompt-db-frontend
            file: frontend/Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          push: true
          build-args: ${{ matrix.image == 'prompt-db-frontend' && format('VITE_API_URL={0}', vars.VITE_API_URL) || '' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.resolve-version.outputs.app_version }}-${{ matrix.platform }}
          outputs: type=image,push-by-digest=true,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }},name-canonical=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.platform }}.digest"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.platform }}
          path: /tmp/digests/*.digest
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [resolve-version, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [prompt-db-backend, prompt-db-frontend]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          VERSION: ${{ needs.resolve-version.outputs.app_version }}
          SHA: ${{ github.sha }}
        run: |
          AMD64_DIGEST="$(tr -d '[:space:]' < /tmp/digests/linux/amd64.digest)"
          ARM64_DIGEST="$(tr -d '[:space:]' < /tmp/digests/linux/arm64.digest)"
          echo "amd64: ${AMD64_DIGEST}"
          echo "arm64: ${ARM64_DIGEST}"
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${SHA}" \
            "${AMD64_DIGEST}" \
            "${ARM64_DIGEST}"

  release:
    needs: [resolve-version, merge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Container-Images

            | Komponente | Image |
            |------------|-------|
            | Backend | `${{ env.REGISTRY }}/${{ github.repository_owner }}/prompt-db-backend:${{ needs.resolve-version.outputs.app_version }}` |
            | Frontend | `${{ env.REGISTRY }}/${{ github.repository_owner }}/prompt-db-frontend:${{ needs.resolve-version.outputs.app_version }}` |

            Multi-Arch: `linux/amd64`, `linux/arm64` (native Runner, kein QEMU für npm).

            Zusätzliche Tags: `${{ github.sha }}`, `latest`

            ## Deployment

            ```bash
            export REGISTRY=${{ env.REGISTRY }}/${{ github.repository_owner }}
            export TAG=${{ needs.resolve-version.outputs.app_version }}

            kubectl set image deployment/prompt-db-backend \
              backend=${REGISTRY}/prompt-db-backend:${TAG} -n prompt-db
            kubectl set image deployment/prompt-db-frontend \
              frontend=${REGISTRY}/prompt-db-frontend:${TAG} -n prompt-db
            ```
